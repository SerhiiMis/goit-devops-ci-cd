apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/SerhiiMis/goit-devops-ci-cd.git"
    targetRevision: HEAD
    path: lesson-8-9/charts/django-app
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: django-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
